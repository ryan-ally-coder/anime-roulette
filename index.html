<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="GPy629ORhSgS-3rr8mKmb35JJKSD_kdVDHOtlunYxpo" />
  <title>Anime Roulette Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-header">
    <h1>Anime Roulette Engine</h1>
    <p>Stage <span id="stageCounter">1</span> | Spin the wheel to explore and fight bosses!</p>
    <!-- Toggle Button for Game Log Sidebar -->
    <button id="toggleLogBtn" class="secondary-btn" style="margin-top: 10px;">📜 View Game Log</button>
  </div>

  <div class="main-container">
    <div class="card wheel-card">
      
      <div id="selectionModeContainer" class="selection-box">
        <button id="toggleModeBtn" class="secondary-btn">🔀 Switch to: Choose an Anime</button>

        <div id="spinModeView" class="mode-view">
          <h2 id="wheelTitle">Select Anime Universe</h2>
          <div class="wheel-box">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="340" height="340"></canvas>
          </div>
          <button id="spinBtn" class="primary-btn">SPIN WHEEL</button>
          <button id="restartBtn" class="secondary-btn hidden" style="margin-top: 10px;">Play Again</button>
        </div>

        <div id="chooseModeView" class="mode-view hidden">
          <div class="dropdown-container">
            <h3>Select Anime Universe</h3>
            <select id="animeSelectDropdown">
              <option value="" disabled selected>-- Choose an Anime --</option>
            </select>
            <button id="confirmSelectBtn" class="primary-btn" style="margin-top: 15px;">Confirm World</button>
          </div>
        </div>

      </div>

    </div>

    <div class="card info-card">
      <div class="info-section">
        <h3>Current Party (<span id="partyCount">0</span>/6)</h3>
        <div id="partyList" class="roster-grid">
          <p class="empty-msg">No characters recruited yet.</p>
        </div>
      </div>

      <div class="info-section">
        <h3>Inventory</h3>
        <div id="inventoryList" class="inventory-grid">
          <p class="empty-msg">Inventory empty.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Toggleable Game Log Sidebar -->
  <div id="logSidebar" class="log-sidebar hidden">
    <div class="sidebar-header">
      <h3>Game Log</h3>
      <button id="closeLogBtn" class="close-btn">&times;</button>
    </div>
    <div id="gameLog" class="log-card-sidebar">
      <!-- Log entries will appear here -->
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
